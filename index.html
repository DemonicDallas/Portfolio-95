<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio-95</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>

</head>
<body>
    <main class="area-de-trabalho">

        <button class="icone" type="button" data-janela="meu-computador">
            <img src="img/icones/windows-plus-my-computer.png" alt="">
            <span>Meu Computador</span>
        </button>

         <button class="icone" type="button" data-janela="sobre-mim">
            <img src="img/icones/windows-plus-help.png" alt="">
            <span>Sobre Mim</span>
        </button>

        <button class="icone" type="button" data-janela="lixeira">
            <img src="img/icones/windows-plus-recycle-bin.png" alt="">
            <span>Lixeira</span>
        </button>

        <button class="icone" type="button" data-janela="internet-explorer">
            <img src="img/icones/windows-internet.png" alt="">
            <span>Internet Explorer</span>
        </button>


       <button class="icone" type="button" data-janela="inbox">
            <img src="img/icones/windows-inbox.png" alt="">
            <span>Inbox</span>
        </button>

        <button class="icone" type="button" data-janela="meus-projetos">
            <img src="img/icones/windows-plus-folder.png" alt="">
            <span>Meus Projetos</span>
        </button>

        <button class="icone" type="button" data-janela="wordPad">
            <img src="img/icones/windows-notepad.png" alt="">
            <span>Bloco de notas</span>
        </button>

        <button class="icone" type="button" data-janela="calculadora">
            <img src="img/icones/windows-calculator.png" alt="">
            <span>Calculadora</span>
        </button>
    </main>
    <footer class="barra-de-tarefas">
        <button class="botao-start" type="button">
            <img src="img/icones/icon-windows.jpg" alt="">
            <span>Iniciar</span>
        </button>

        <div class="janelas-abertas">

        </div>
        <div class="relogio">12:00 PM</div>
    </footer>

</body>
</html>
